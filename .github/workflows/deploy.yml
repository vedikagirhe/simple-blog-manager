name: NGINX EC2 Deployment Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy-to-ec2:
    runs-on: [self-hosted, dev-agent]

    steps:
      # Step 1: Get latest code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Copy website files to NGINX
      - name: Deploy website to NGINX
        run: |
          echo "Starting deployment..."

          sudo rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            ./ /var/www/html/

      # Step 3: Restart NGINX
      - name: Restart NGINX
        run: |
          sudo systemctl restart nginx

      # Step 4: Check NGINX status
      - name: Check NGINX
        run: |
          sudo systemctl status nginx --no-pager